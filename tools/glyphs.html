<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flux: лаборатория глифов</title>
<style>
  :root { --bg:#0e0e10; --surf:#1a1a1d; --surf2:#26262a; --ink:#e9e9ec; --dim:#8d8d94; --accent:#5B79FF; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; font-weight:600; }
  h2 { font-size:15px; margin:32px 0 10px; font-weight:600; color:var(--dim); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:14px 0 18px; }
  .seg { display:inline-flex; background:var(--surf); border-radius:10px; padding:3px; gap:2px; }
  .seg button { background:transparent; color:var(--dim); border:0; border-radius:8px; padding:6px 14px; font:inherit; cursor:pointer; }
  .seg button.on { background:var(--surf2); color:var(--ink); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  table { border-collapse:separate; border-spacing:8px; }
  th { color:var(--dim); font-weight:500; font-size:12px; text-align:center; }
  td { background:var(--surf); border-radius:12px; padding:10px; vertical-align:bottom; text-align:center; }
  td.lab { background:none; color:var(--dim); font-size:28px; font-weight:300; vertical-align:middle; }
  svg { display:block; margin:auto; }
  .cmp { display:flex; flex-wrap:wrap; gap:10px; }
  .cmp figure { margin:0; background:var(--surf); border-radius:12px; padding:10px; text-align:center; font-size:12px; color:var(--dim); }
  .cmp canvas { display:block; margin:0 auto 6px; border-radius:6px; }
  .refs { display:flex; flex-wrap:wrap; gap:10px; }
  .refs img { max-height:360px; border-radius:12px; background:#000; }
  .sc { color:var(--ink); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Flux: лаборатория глифов</h1>
<div style="color:var(--dim)">Монолинейные глифы 0–9, штрих t = 4u во всех боксах. Строится кодом (src/glyph.js), шрифтов нет.</div>
<div class="bar">
  <div class="seg" id="modeSeg"><button data-m="fill" class="on">заливка</button><button data-m="aod">контур (AOD)</button></div>
  <div class="seg" id="uSeg"><button data-u="3.5">мелко</button><button data-u="4.5" class="on">средне</button><button data-u="6">крупно</button></div>
</div>

<h2>Цифры × пропорции бокса (w × h в u)</h2>
<div id="table"></div>

<h2>Сверка с эталоном: наш глиф (красный) поверх чернил кропа (синий), белое = совпало</h2>
<div class="cmp" id="cmp"></div>
<div class="sc" id="cmpSummary" style="margin-top:10px"></div>

<h2>Эталонные кропы</h2>
<div class="refs">
  <img src="../reference/crops/0237_19_hires.png" alt="02:37:19">
  <img src="../reference/crops/0309_0310_hires.png" alt="03:09 03:10">
  <img src="../reference/crops/1225_to_1226_morph.png" alt="12:25→12:26">
  <img src="../reference/crops/1009_always_on.png" alt="10:09 AOD">
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- контур штриха: «глиф минус эрозия глифа». Радиус эрозии = 0.12t, масштаб задаётся через переменную в JS -->
    <filter id="aodf" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feMorphology id="aodEr" in="SourceAlpha" operator="erode" radius="1" result="er"/>
      <feComposite in="SourceGraphic" in2="er" operator="out"/>
    </filter>
  </defs>
</svg>

<script src="../src/glyph.js"></script>
<script>
(function () {
  var T = 4, SIZES = [[8,30],[14,30],[20,20],[30,14],[24,18],[36,10]];
  var mode = 'fill', U = 4.5;
  function build() {
    var html = '<table><tr><th></th>' + SIZES.map(function (s) { return '<th>' + s[0] + '×' + s[1] + '</th>'; }).join('') + '</tr>';
    for (var d = 0; d <= 9; d++) {
      html += '<tr><td class="lab">' + d + '</td>';
      SIZES.forEach(function (s) {
        var W = s[0] * U, H = s[1] * U, pad = 6;
        var p = FluxGlyph.glyphPath(d, 0, 0, s[0], s[1], T, null, U, U, pad, pad);
        var filt = mode === 'aod' ? ' filter="url(#aodf)"' : '';
        html += '<td><svg width="' + (W + 2*pad) + '" height="' + (H + 2*pad) + '"><path d="' + p + '" fill="' + (mode === 'aod' ? '#5B79FF' : '#e9e9ec') + '"' + filt + '/></svg></td>';
      });
      html += '</tr>';
    }
    document.getElementById('table').innerHTML = html + '</table>';
    document.getElementById('aodEr').setAttribute('radius', Math.max(0.6, 0.12 * T * U).toFixed(2));
  }
  function seg(id, attr, cb) {
    var el = document.getElementById(id);
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      el.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      cb(b.dataset[attr]);
    });
  }
  seg('modeSeg', 'm', function (v) { mode = v; build(); });
  seg('uSeg', 'u', function (v) { U = parseFloat(v); build(); });
  build();

  /* сверка с эталонными кропами */
  fetch ? null : null;
})();
</script>
<script src="_inst.js"></script>
<script>
(function () {
  if (!window.FLUX_REF_INSTANCES) return;
  var cmp = document.getElementById('cmp'), sums = [], pending = 0, cache = {}, lcache = {};
  function load(src, cb) {
    if (cache[src]) return cb(cache[src]);
    var im = new Image(); im.onload = function () { cache[src] = im; cb(im); }; im.src = src;
  }
  function isInk(mode, r, g, b) {
    if (mode === 'gray') return Math.abs(r-128) < 30 && Math.abs(g-128) < 30 && Math.abs(b-128) < 30;
    if (mode === 'black') return r < 60 && g < 60 && b < 60;
    return (r < 60 && g < 60 && b < 60) || (Math.abs(r-214) < 22 && Math.abs(g-214) < 22 && Math.abs(b-216) < 22);
  }
  /* разметка связных компонент всего изображения (как scipy.ndimage.label, 4-связность) */
  function labelImage(im, mode) {
    var key = im.src + '#' + mode; if (lcache[key]) return lcache[key];
    var W = im.naturalWidth, H = im.naturalHeight, c = document.createElement('canvas'); c.width = W; c.height = H;
    var cx = c.getContext('2d', { willReadFrequently: true }); cx.drawImage(im, 0, 0);
    var d = cx.getImageData(0, 0, W, H).data, N = W * H, ink = new Uint8Array(N), lab = new Int32Array(N), par = [0], i, x, y;
    for (i = 0; i < N; i++) ink[i] = isInk(mode, d[i*4], d[i*4+1], d[i*4+2]) ? 1 : 0;
    function find(a) { while (par[a] !== a) { par[a] = par[par[a]]; a = par[a]; } return a; }
    var next = 1;
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      i = y * W + x; if (!ink[i]) continue;
      var l = x > 0 ? lab[i-1] : 0, u = y > 0 ? lab[i-W] : 0;
      if (!l && !u) { par.push(next); lab[i] = next++; }
      else if (l && u) { var a = find(l), b = find(u); if (a !== b) par[Math.max(a,b)] = Math.min(a,b); lab[i] = Math.min(a,b); }
      else lab[i] = l || u;
    }
    var bb = {};
    for (y = 0; y < H; y++) for (x = 0; x < W; x++) {
      i = y * W + x; if (!lab[i]) continue;
      var r = find(lab[i]); lab[i] = r;
      var o = bb[r] || (bb[r] = [x, y, x + 1, y + 1, 0]);
      if (x < o[0]) o[0] = x; if (y < o[1]) o[1] = y; if (x + 1 > o[2]) o[2] = x + 1; if (y + 1 > o[3]) o[3] = y + 1; o[4]++;
    }
    return (lcache[key] = { W: W, H: H, lab: lab, bb: bb });
  }
  window.FLUX_REF_INSTANCES.forEach(function (it) {
    pending++;
    load(it.img, function (im) {
      var L = labelImage(im, it.mode), tol = 5;
      var keep = {}; Object.keys(L.bb).forEach(function (k) {
        var o = L.bb[k];
        if (o[0] >= it.bbox[0]-tol && o[1] >= it.bbox[1]-tol && o[2] <= it.bbox[2]+tol && o[3] <= it.bbox[3]+tol && (o[2]-o[0])*(o[3]-o[1]) > 150) keep[k] = 1;
      });
      var x0 = it.bbox[0], y0 = it.bbox[1], x1 = it.bbox[2], y1 = it.bbox[3], pad = 6;
      var W = x1 - x0 + 2 * pad, H = y1 - y0 + 2 * pad;
      var c = document.createElement('canvas'); c.width = W; c.height = H;
      var cx = c.getContext('2d');
      var ink = new Uint8Array(W * H);
      for (var yy = 0; yy < H; yy++) for (var xx = 0; xx < W; xx++) {
        var gx = x0 - pad + xx, gy = y0 - pad + yy;
        if (gx < 0 || gy < 0 || gx >= L.W || gy >= L.H) continue;
        var lb = L.lab[gy * L.W + gx];
        ink[yy * W + xx] = (lb && keep[lb]) ? 1 : 0;
      }
      var m = document.createElement('canvas'); m.width = W; m.height = H;
      var mx = m.getContext('2d');
      var u = it.u, w = (x1 - x0) / u, h = (y1 - y0) / u;
      mx.fillStyle = '#fff'; mx.fill(new Path2D(FluxGlyph.glyphPath(it.d, 0, 0, w, h, 4, null, u, u, pad, pad)));
      var mine = mx.getImageData(0, 0, W, H).data, inter = 0, uni = 0, out = cx.createImageData(W, H);
      for (var j = 0; j < W * H; j++) {
        var a = mine[j*4+3] / 255, bb2 = ink[j];
        inter += Math.min(a, bb2); uni += Math.max(a, bb2);
        out.data[j*4] = 255 * a; out.data[j*4+1] = 255 * Math.min(a, bb2); out.data[j*4+2] = 255 * bb2; out.data[j*4+3] = 255;
      }
      cx.putImageData(out, 0, 0);
      var iou = inter / Math.max(uni, 1), fig = document.createElement('figure');
      var sc = Math.min(1, 260 / W, 300 / H); c.style.width = (W * sc) + 'px';
      fig.appendChild(c); fig.appendChild(document.createTextNode(it.name + ' · IoU ' + iou.toFixed(3)));
      cmp.appendChild(fig); sums.push({ d: it.d, iou: iou });
      if (--pending === 0) {
        var by = {}; sums.forEach(function (s) { (by[s.d] = by[s.d] || []).push(s.iou); });
        document.getElementById('cmpSummary').textContent = 'Средний IoU по цифрам: ' + Object.keys(by).sort().map(function (k) {
          var a = by[k]; return k + ' = ' + (a.reduce(function (x, y) { return x + y; }, 0) / a.length).toFixed(3) + ' (' + a.length + ')';
        }).join(' · ');
      }
    });
  });
})();
</script>
</body>
</html>
